
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Employee</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">
            <h2 class="mb-4">Add Employee</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label" for="name">Full Name</label>
                    <input class="form-control" id="name" name="name"
                           maxlength="120" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email"
                           name="email" maxlength="120" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="phone">Phone</label>
                    <input class="form-control" id="phone" name="phone"
                           maxlength="20" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="department">Department</label>
                    <input class="form-control" id="department" name="department"
                           maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="designation">Designation</label>
                    <input class="form-control" id="designation" name="designation"
                           maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="salary">Salary</label>
                    <input class="form-control" type="number" id="salary"
                           name="salary" min="0" step="0.01" required>
                </div>

                <button class="btn btn-primary" type="submit">Save Employee</button>
                <a href="{{ url_for('employees') }}"
                   class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
